[package]
name = "timeschedule"
version = "0.1.2"
description = "A small personal desktop calendar"
edition = "2021"

[lib]
name = "timeschedule_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["clock"] }
timeschedule-core = { path = "../crates/timeschedule-core" }
timeschedule-desktop = { path = "../crates/timeschedule-desktop" }

[dev-dependencies]
timeschedule-desktop = { path = "../crates/timeschedule-desktop", features = ["test-support"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
