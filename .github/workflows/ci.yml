# Checks every pull request and every push to main.
# Windows only: the app relies on Win32, DPAPI and Windows file semantics.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # The toolchain this project is developed and released with.
  RUST_TOOLCHAIN: "1.99.1"

jobs:
  checks:
    name: Format, lint and tests
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      # Actions are pinned to reviewed commits; the comment names the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # build.rs calls the Windows SDK's rc.exe, which is only on PATH inside a
      # Visual Studio developer environment (scripts/toolchain.ps1 does the same).
      - name: Enter Visual Studio developer environment
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Visual Studio C++ build tools were not found.' }
          $devCmd = Join-Path $vs 'Common7/Tools/VsDevCmd.bat'
          $names = '^(Path|INCLUDE|LIB|LIBPATH|UCRTVersion|UniversalCRTSdkDir|VCINSTALLDIR|VCToolsInstallDir|VCToolsVersion|VSINSTALLDIR|VisualStudioVersion|WindowsLibPath|WindowsSdkBinPath|WindowsSdkDir|WindowsSdkVerBinPath|WindowsSDKLibVersion|WindowsSDKVersion)='
          $lines = cmd /d /s /c "`"$devCmd`" -no_logo -arch=x64 -host_arch=x64 && set"
          if ($LASTEXITCODE -ne 0) { throw 'Could not load the Visual Studio developer environment.' }
          $lines | Where-Object { $_ -match $names } | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Confirm resource compiler
        run: (Get-Command rc.exe -ErrorAction Stop).Source

      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal --component rustfmt,clippy
          rustup default $env:RUST_TOOLCHAIN

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-

      - name: Format
        run: cargo fmt --all -- --check

      # Reported, not enforced, until the existing warnings are cleared.
      - name: Clippy (report only)
        continue-on-error: true
        run: cargo clippy --workspace --all-targets --locked

      - name: Tests
        run: cargo test --workspace --locked

      # This integration target only builds with the test-support feature.
      - name: Desktop integration test
        run: cargo test -p timeschedule-desktop --features test-support --test desktop_native --locked

      - name: Build native app
        run: cargo build -p timeschedule-native --locked

      # benchmark-archive.tests.ps1 and benchmark-fixtures.tests.ps1 validate
      # untracked local benchmark artifacts and the local .tooling folder, so
      # they are manual checks and are not run here.
      - name: PowerShell script tests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & powershell -NoProfile -ExecutionPolicy Bypass -File scripts/tests/measure-memory.tests.ps1
          if ($LASTEXITCODE -ne 0) { throw 'measure-memory tests failed' }
          & powershell -NoProfile -ExecutionPolicy Bypass -File scripts/tests/publish-native.tests.ps1 -SourcePath target/debug/timeschedule-native.exe -CheckRunningApp
          if ($LASTEXITCODE -ne 0) { throw 'publish-native tests failed' }

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # With the built EXE, the native diary capture integration test runs too.
      - name: Node record and vault tests
        env:
          TIMESCHEDULE_RECORD_TEST_EXE: ${{ github.workspace }}/target/debug/timeschedule-native.exe
        run: npm test
