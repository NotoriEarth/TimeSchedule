# Checks every pull request and every push to main.
# Windows only: the app relies on Win32, DPAPI and Windows file semantics.
name: CI

on:
  # Changes that touch only documentation have nothing for these checks to run.
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Tests need no debug info. Leaving it out speeds up compiling and linking on
  # Windows and keeps the build cache small.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  # The toolchain this project is developed and released with.
  RUST_TOOLCHAIN: "1.99.1"

jobs:
  # Runs in parallel with the tests. Lint compiles separately (check mode), so
  # splitting it off shortens the wait instead of adding to it.
  lint:
    name: Format and lint
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # Actions are pinned to reviewed commits; the comment names the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/msvc-env

      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal --component rustfmt,clippy
          rustup default $env:RUST_TOOLCHAIN

      - name: Format
        run: cargo fmt --all -- --check

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-v2-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-lint-${{ hashFiles('Cargo.lock') }}
          restore-keys: rust-v2-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-lint-

      # Reported, not enforced, until the existing warnings are cleared.
      - name: Clippy (report only)
        continue-on-error: true
        run: cargo clippy --workspace --all-targets --locked

  test:
    name: Tests
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/msvc-env

      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal
          rustup default $env:RUST_TOOLCHAIN

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-v2-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-test-${{ hashFiles('Cargo.lock') }}
          restore-keys: rust-v2-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-test-

      # test-support only exposes the desktop_native fixture, so the integration
      # target runs in the same pass instead of a second compile.
      - name: Rust tests
        run: cargo test --workspace --locked --features timeschedule-desktop/test-support

      - name: Build native app
        run: cargo build -p timeschedule-native --locked

      # benchmark-archive.tests.ps1 and benchmark-fixtures.tests.ps1 validate
      # untracked local benchmark artifacts and the local .tooling folder, so
      # they are manual checks and are not run here.
      - name: PowerShell script tests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & powershell -NoProfile -ExecutionPolicy Bypass -File scripts/tests/measure-memory.tests.ps1
          if ($LASTEXITCODE -ne 0) { throw 'measure-memory tests failed' }
          & powershell -NoProfile -ExecutionPolicy Bypass -File scripts/tests/publish-native.tests.ps1 -SourcePath target/debug/timeschedule-native.exe -CheckRunningApp
          if ($LASTEXITCODE -ne 0) { throw 'publish-native tests failed' }

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # With the built EXE, the native diary capture integration test runs too.
      - name: Node record and vault tests
        env:
          TIMESCHEDULE_RECORD_TEST_EXE: ${{ github.workspace }}/target/debug/timeschedule-native.exe
        run: npm test
