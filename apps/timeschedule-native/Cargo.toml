[package]
name = "timeschedule-native"
version = "0.33.0"
edition = "2021"
publish = false

[dependencies]
iced = { version = "=0.14.0", default-features = false, features = ["tiny-skia", "tokio", "advanced"] }
tokio = { version = "1", features = ["rt", "time"] }
rmcp = { version = "=3.8.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
hyper = { version = "=1.12.0", default-features = false, features = ["server", "client", "http1"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio", "service"] }
tokio-util = "0.7"
raw-window-handle = "0.6"
unicode-segmentation = "1"
chrono = { version = "0.4", features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = "=0.25.17"
base64 = "=0.23.1"
http-body-util = "=0.1.5"
uuid = { version = "1", features = ["v4"] }
timeschedule-core = { path = "../../crates/timeschedule-core" }
timeschedule-desktop = { path = "../../crates/timeschedule-desktop" }

[dev-dependencies]
iced_runtime = "=0.14.0"
iced_tiny_skia = { version = "=0.14.1", default-features = false }
tiny-skia = { version = "=0.11.4", default-features = false, features = ["std"] }
png = "0.18"
softbuffer = { version = "=0.4.8", default-features = false }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_Security_Cryptography", "Win32_System_Memory", "Win32_System_JobObjects", "Win32_System_Threading"] }
