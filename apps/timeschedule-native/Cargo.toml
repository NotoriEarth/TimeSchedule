[package]
name = "timeschedule-native"
version = "0.7.0"
edition = "2021"
publish = false

[dependencies]
iced = { version = "=0.14.0", default-features = false, features = ["tiny-skia", "tokio", "advanced"] }
tokio = { version = "1", features = ["rt", "time"] }
raw-window-handle = "0.6"
chrono = { version = "0.4", features = ["clock"] }
timeschedule-core = { path = "../../crates/timeschedule-core" }
timeschedule-desktop = { path = "../../crates/timeschedule-desktop" }

[dev-dependencies]
tiny-skia = { version = "=0.11.4", default-features = false, features = ["std"] }
png = "0.18"
softbuffer = { version = "=0.4.8", default-features = false }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader"] }
